name: Compilar Droid7BR com QEMU ARM64

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar QEMU e APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar Droid7BR
        uses: actions/checkout@v4

      - name: Baixar receita de compilação QEMU (Podroid, commit fixo)
        uses: actions/checkout@v4
        with:
          repository: ExTV/Podroid
          ref: e3fc1befa3c135d28bf8d40e3c2264d93fea87ef
          path: third_party/podroid-build

      - name: Compilar QEMU ARM64 para Android com NDK
        run: |
          docker build --target qemu-builder -t droid7br-qemu third_party/podroid-build
          container_id="$(docker create droid7br-qemu)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          docker cp "$container_id:/opt/qemu-out/libqemu-system-aarch64.so" app/src/main/jniLibs/arm64-v8a/
          docker cp "$container_id:/opt/qemu-out/libslirp.so" app/src/main/jniLibs/arm64-v8a/
          mkdir -p app/src/main/assets/licenses
          docker cp "$container_id:/qemu-11.1.2/COPYING" app/src/main/assets/licenses/QEMU-COPYING
          cp third_party/podroid-build/LICENSE app/src/main/assets/licenses/Podroid-GPL-2.0
          docker rm "$container_id"
          file app/src/main/jniLibs/arm64-v8a/*
          readelf -h app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so | grep -E "Class:|Machine:"
          readelf -d app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so | grep NEEDED
          test -x app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so
          test -s app/src/main/jniLibs/arm64-v8a/libslirp.so

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK com QEMU
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Droid7BR-debug-arm64-qemu
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
